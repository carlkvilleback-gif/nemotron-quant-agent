name: Daily research

on:
  schedule:
    - cron: "0 7 * * 1-5"  # 07:00 UTC on weekdays, before the European open
  workflow_dispatch:  # lets you start a run by hand from the Actions tab

permissions:
  contents: write  # the run commits its report back to the repo

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python agent.py
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      - name: Commit the new report
        run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add reports
          git commit -m "Daily research $(date -u +%F)" || echo "nothing to commit"
          git push
